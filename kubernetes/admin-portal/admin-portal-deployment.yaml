apiVersion: apps/v1
kind: Deployment

metadata:
  name: admin-portal
  namespace: devops-project
  labels:
    app: admin-portal

spec:
  replicas: 2

  selector:
    matchLabels:
      app: admin-portal

  template:

    metadata:
      labels:
        app: admin-portal

    spec:

      containers:

      - name: admin-portal

        image: YOUR_DOCKERHUB_USERNAME/admin-portal:v1

        imagePullPolicy: Always

        ports:
        - containerPort: 8083

        resources:

          requests:
            cpu: "100m"
            memory: "128Mi"

          limits:
            cpu: "250m"
            memory: "256Mi"

        readinessProbe:
          httpGet:
            path: /
            port: 8083

          initialDelaySeconds: 10
          periodSeconds: 10

        livenessProbe:
          httpGet:
            path: /
            port: 8083

          initialDelaySeconds: 30
          periodSeconds: 20
