<!DOCTYPE html>
<html>

<head>

    <title>Admin Login</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="login-card">

    <h2>Administrator Login</h2>

    <form id="loginForm">

        <input
                type="email"
                id="email"
                placeholder="Email"
                required>

        <input
                type="password"
                id="password"
                placeholder="Password"
                required>

        <button type="submit">

            Login

        </button>

    </form>

    <p id="message"></p>

</div>

<script src="js/api.js"></script>

<script src="js/auth.js"></script>

</body>

</html>
