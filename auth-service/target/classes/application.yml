server:
  port: 8081

spring:

  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
 
  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

  redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT}

 management:
  endpoints:
    web:
      exposure:
        include: "*"

 management:
  endpoint:
    health:
      show-details: always

 jwt:
  secret: ${JWT_SECRET}
